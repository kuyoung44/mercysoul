name: MercySoul Golden Path

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Golden Path
        run: node templates/mercysoul-project/scripts/verify-golden-path.mjs
