name: MercySoul OS — Security Hardening

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-hardening:
    name: Security & Integrity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Regenerate lockfile without lifecycle scripts
        if: hashFiles('package.json') != ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking dependency security updates
        if: hashFiles('package-lock.json') != ''
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Install from regenerated lockfile
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scan for secrets
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --no-banner --redact \
            --report-format json --report-path /repo/reports/gitleaks.json
          scan_status=$?
          set -e
          if [ -s reports/gitleaks.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const findings = JSON.parse(fs.readFileSync("reports/gitleaks.json", "utf8"));
              const safe = findings.map(({ RuleID, File, StartLine, Commit, Description }) => ({
                rule: RuleID, file: File, line: StartLine, commit: Commit, description: Description
              }));
              fs.writeFileSync("reports/gitleaks-findings.json", JSON.stringify(safe, null, 2));
              console.log("Secret-scan metadata only (secret values omitted):");
              console.log(JSON.stringify(safe, null, 2));
            '
          fi
          exit "$scan_status"

      - name: Upload redacted secret-scan metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercysoul-gitleaks-metadata
          path: reports/gitleaks-findings.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Scan for prohibited content
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning repository for high-confidence prohibited content..."

          PATTERN='(fullz market|sell fullz|buy fullz|card dump|stolen cards|bank logs|rat builder|ransomware|keylogger|botnet|phishing kit|scampage|malware builder)'

          if grep -RniE "$PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude-dir=coverage \
            --exclude='package-lock.json' \
            --exclude='public/acceptable-use.html' \
            --exclude='pnpm-lock.yaml' \
            --exclude='yarn.lock' \
            --exclude-dir=workflows \
            --binary-files=without-match; then
            echo "❌ Prohibited content detected."
            exit 1
          fi

          echo "✅ Prohibited-content scan passed."

      - name: Detect dangerous repository files
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \
            \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.scr' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' | grep -q .; then
            echo "❌ Potentially dangerous executable/script files detected."
            find . -type f \
              \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.scr' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*'
            exit 1
          fi

          echo "✅ Dangerous-file scan passed."

      - name: Dependency vulnerability audit
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=moderate

      - name: Run project checks
        if: hashFiles('package.json') != ''
        run: npm run check --if-present

      - name: Verify production build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Repository integrity summary
        run: |
          {
            echo "# MercySoul OS Security Hardening"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Secret scan: passed"
            echo "- Prohibited-content scan: passed"
            echo "- Dangerous-file scan: passed"
            echo "- Dependency audit: completed when package-lock.json exists"
            echo "- Code check: completed when configured"
            echo "- Production build: completed when configured"
          } > security-hardening-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: mercysoul-security-hardening-report
          path: |
            security-hardening-report.md
            package-lock.json
