name: MercySoul CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax and test checks
        run: npm run check

      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version||!p.scripts?.start) process.exit(1); console.log(p.name+' '+p.version+' OK')"
