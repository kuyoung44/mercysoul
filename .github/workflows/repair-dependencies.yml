name: Repair dependency lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require a clean dependency audit
        run: npm audit --audit-level=moderate

      - name: Run project tests
        run: npm run check --if-present

      - name: Verify production build
        run: npm run build --if-present

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
