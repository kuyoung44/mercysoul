name: MercySoul OS - Build, Verify & Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercysoul-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build / syntax check
        run: npm run check

      - name: Run tests
        run: |
          node src/alignment.test.js
          node src/creation-engine.test.js

      - name: Security gate
        run: node scripts/security-check.js

      - name: Start server for health gate
        run: node server.js > /tmp/mercysoul-server.log 2>&1 &

      - name: Runtime health gate
        run: |
          for i in {1..15}; do
            if node scripts/health-check.js; then exit 0; fi
            sleep 1
          done
          cat /tmp/mercysoul-server.log
          exit 1

      - name: Diagnose repository state
        if: always()
        run: node scripts/ci-diagnose.js

      - name: Generate CI report
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# MercySoul OS CI Report"
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo "Workflow status: ${{ job.status }}"
          } > reports/build-report.md
          if [ -f /tmp/mercysoul-server.log ]; then cp /tmp/mercysoul-server.log reports/server.log; fi

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercysoul-os-report-${{ github.run_id }}
          path: reports/
          retention-days: 14
