name: MercySoul OS - Build, Verify & Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build / syntax check
        run: npm run check

      - name: Run tests
        run: |
          node src/alignment.test.js
          node src/creation-engine.test.js

      - name: Diagnose repository state
        if: always()
        run: node scripts/ci-diagnose.js

      - name: Generate CI report
        if: always()
        run: |
          mkdir -p reports
          {
            echo "# MercySoul OS CI Report"
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo "Workflow status: ${{ job.status }}"
          } > reports/build-report.md

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mercysoul-os-report-${{ github.run_id }}
          path: reports/
          retention-days: 14
