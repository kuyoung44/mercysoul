name: One-Prompt Agent Builder Tests

on:
  pull_request:
    paths:
      - "src/sovereign/prompt-to-agent.js"
      - "src/sovereign/prompt-to-agent.test.js"
      - ".github/workflows/one-prompt-agent-builder-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "src/sovereign/prompt-to-agent.js"
      - "src/sovereign/prompt-to-agent.test.js"
      - ".github/workflows/one-prompt-agent-builder-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-to-agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run focused tests
        run: node --test src/sovereign/prompt-to-agent.test.js
