name: MercySoul Guardian Security Gate

on:
  push:
    branches: [main, feature/endpoint-guardian]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax and test gate
        run: npm run check
      - name: Reject obvious credential-capture implementation terms
        run: |
          if grep -RniE --include='*.js' --exclude='*.test.js' --exclude='event-schema.js' 'GetAsyncKeyState|SetWindowsHookEx|keyboard hook|clipboard.*capture|password.*capture|keylogger' src/guardian; then
            echo 'Guardian safety gate failed: prohibited capture implementation detected.'
            exit 1
          fi
