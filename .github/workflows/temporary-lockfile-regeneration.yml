name: Temporary lockfile regeneration

on:
  push:
    branches: [fix/vision-brain-foundation-reliability]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-brain-foundation-reliability
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: synchronize npm lockfile"
            git push
          else
            echo "Lockfile is already synchronized."
          fi
