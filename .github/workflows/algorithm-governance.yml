name: MercySoul Algorithm Governance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check src/governance/algorithm-governance.js
      - name: Governance tests
        run: node --test src/governance/algorithm-governance.test.js
