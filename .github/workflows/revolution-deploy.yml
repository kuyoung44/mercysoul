name: MercySoul Revolution Deploy
# Deployment trigger: refresh Vercel from the latest main commit.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revolution-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Illegal and malicious content scan
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='fullz|carding|cvv|dumps|bank logs|stolen cards|hacking tool|keylogger|ransomware|botnet|ddos tool|exploit kit|phishing kit|rm -rf /|curl[[:space:]]*\|[[:space:]]*bash'
          if git grep -I -n -i -E "$PATTERN" -- ':!.git/*' ':!node_modules/*' ':!package-lock.json' ':!.github/workflows/*'; then
            echo "Security content gate failed: blocked content detected."
            exit 1
          fi
          echo "Security content gate passed."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

      - name: Run build
        run: npm run build --if-present

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [security, test]
    if: ${{ always() && needs.security.result == 'success' && github.event_name != 'pull_request' && secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Completion
        run: echo "MercySoul Revolution deployment completed successfully."
