.preview-text{font-size:1rem;color:#d8c58d;line-height:1.7}
.preview-arrow{display:block;font-size:2.2rem;margin-top:18px}
@keyframes breath{0%,100%{transform:scale(1);box-shadow:inset 0 0 40px rgba(247,214,106,.04),0 0 28px rgba(247,214,106,.16)}50%{transform:scale(1.025);box-shadow:inset 0 0 50px rgba(247,214,106,.07),0 0 48px rgba(247,214,106,.34)}}
