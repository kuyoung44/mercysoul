<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercySoul Vision Brain</title>
    <style>
        body { background: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
        .header { background: linear-gradient(90deg, #4b0082, #1a1a2e); padding: 20px; text-align: center; border-bottom: 2px solid #d4af37; }
        .header h1 { color: #d4af37; margin: 0; font-size: 1.5rem; }
        .header p { color: #ccc; margin: 5px 0 0; font-size: 0.8rem; }
        .document-bar { padding: 12px 20px; background: #0d0d1a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .upload-label { display: inline-block; padding: 10px 16px; border-radius: 25px; border: 1px solid #d4af37; background: #d4af37; color: black; font-weight: bold; cursor: pointer; }
        .upload-label:hover { background: #b8860b; }
        #pdfInput { display: none; }
        #fileName { color: #ccc; font-size: 0.85rem; }
        .loading { font-size: 0.8rem; color: #d4af37; font-style: italic; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 15px; border-radius: 15px; font-size: 1rem; line-height: 1.55; }
        .user { align-self: flex-end; background: linear-gradient(90deg, #d4af37, #b8860b); color: black; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: #1a1a2e; border: 1px solid #444; border-bottom-left-radius: 2px; }
        .bot strong { color: #d4af37; font-weight: 700; }
        .bot ul { margin: 8px 0 10px 20px; padding: 0; }
        .bot li { margin: 5px 0; padding-left: 2px; }
        .bot .markdown-line { margin: 3px 0; }
        .bot .markdown-spacer { height: 7px; }
        .bot a.whatsapp-button { display: inline-block; margin-top: 8px; padding: 10px 16px; border-radius: 22px; background: #d4af37; color: #111; text-decoration: none; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
        .bot a.whatsapp-button:hover { background: #f0c94f; }
        .bot .signature { display: block; margin-top: 10px; font-weight: 600; color: #d4af37; }
        .input-area { padding: 20px; background: #0d0d1a; display: flex; gap: 10px; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #d4af37; background: #111; color: white; outline: none; font-size: 1rem; user-select: text; -webkit-user-select: text; }
        button { padding: 12px 20px; border-radius: 25px; border: none; background: #d4af37; color: black; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #b8860b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👑 MercySoul Vision Brain</h1>
        <p>Where Imagination Becomes Sacred Art</p>
    </div>
    <div class="document-bar">
        <label class="upload-label" for="pdfInput">Upload Document</label>
        <input id="pdfInput" type="file" accept="application/pdf,.pdf">
        <span id="fileName">No PDF selected</span>
        <span id="documentLoading" class="loading" hidden>Processing Document...</span>
    </div>
    <div class="chat-container" id="chatBox">
        <div class="message bot">Welcome to the <strong>MercySoul Vision Brain</strong>.<br><span style="color:#ccc;">Where Imagination Becomes Sacred Art.</span><span class="signature">Asẹ.</span></div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Describe what you need...">
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>

    <script>
        let selectedPdf = null;
        const WHATSAPP_URL = 'https://wa.me/2348135278110';
        const WHATSAPP_MARKDOWN = '[Click here to chat with us on WhatsApp](' + WHATSAPP_URL + ')';

        ['contextmenu', 'copy', 'cut', 'dragstart'].forEach(function (eventName) {
            document.addEventListener(eventName, function (event) {
                if (event.target.id !== 'userInput') event.preventDefault();
            });
        });

        const pdfInput = document.getElementById('pdfInput');
        const fileName = document.getElementById('fileName');
        const documentLoading = document.getElementById('documentLoading');
        const sendButton = document.getElementById('sendButton');

        pdfInput.addEventListener('change', function () {
            const file = pdfInput.files?.[0];
            if (!file) return;
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                pdfInput.value = '';
                selectedPdf = null;
                fileName.textContent = 'Please select a PDF file';
                return;
            }
            selectedPdf = file;
            fileName.textContent = file.name;
        });

        function appendMessage(type, text) {
            const div = document.createElement('div');
            div.className = `message ${type}`;

            if (type === 'bot') {
                renderBotMessage(div, text);
            } else {
                div.textContent = text;
            }

            document.getElementById('chatBox').appendChild(div);
            return div;
        }

        function appendInlineMarkdown(container, text) {
            const parts = String(text || '').split(/(\*\*[^*]+\*\*)/g);
            parts.forEach(function (part) {
                if (!part) return;
                if (part.startsWith('**') && part.endsWith('**')) {
                    const strong = document.createElement('strong');
                    strong.textContent = part.slice(2, -2);
                    container.appendChild(strong);
                } else {
                    container.appendChild(document.createTextNode(part));
                }
            });
        }

        function renderBotMessage(container, text) {
            const value = String(text || '').replace(/\r\n/g, '\n').trim();
            const signature = /\n*Asẹ\.$/u.test(value) ? 'Asẹ.' : '';
            const body = signature ? value.replace(/\n*Asẹ\.$/u, '').trim() : value;
            const lines = body.split('\n');
            let list = null;

            function closeList() { list = null; }

            lines.forEach(function (rawLine) {
                const line = rawLine.trim();
                if (!line) {
                    closeList();
                    const spacer = document.createElement('div');
                    spacer.className = 'markdown-spacer';
                    container.appendChild(spacer);
                    return;
                }

                if (line === WHATSAPP_MARKDOWN) {
                    closeList();
                    const link = document.createElement('a');
                    link.className = 'whatsapp-button';
                    link.href = WHATSAPP_URL;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = 'Chat on WhatsApp';
                    container.appendChild(link);
                    return;
                }

                if (/^-\s+/.test(line)) {
                    if (!list) {
                        list = document.createElement('ul');
                        container.appendChild(list);
                    }
                    const item = document.createElement('li');
                    appendInlineMarkdown(item, line.replace(/^-\s+/, ''));
                    list.appendChild(item);
                    return;
                }

                closeList();
                const paragraph = document.createElement('div');
                paragraph.className = 'markdown-line';
                appendInlineMarkdown(paragraph, line);
                container.appendChild(paragraph);
            });

            if (signature) {
                const signatureEl = document.createElement('span');
                signatureEl.className = 'signature';
                signatureEl.textContent = signature;
                container.appendChild(signatureEl);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatBox');
            appendMessage('user', message);
            input.value = '';
            sendButton.disabled = true;

            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerText = selectedPdf ? 'Processing Document...' : 'MercySoul is thinking...';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let response;
                if (selectedPdf) {
                    const formData = new FormData();
                    formData.append('file', selectedPdf, selectedPdf.name);
                    formData.append('message', message);
                    response = await fetch('/api/chat', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message })
                    });
                }

                const data = await response.json().catch(() => ({}));
                loading.remove();
                appendMessage('bot', data.reply || data.error || 'Please try again.');
            } catch (error) {
                loading.remove();
                appendMessage('bot', 'Connection error. Try again later. Asẹ.');
            } finally {
                sendButton.disabled = false;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
