<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercySoul Vision Brain</title>
<style>
body{background:#050510;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;user-select:none;-webkit-user-select:none}
input,button,.upload-label,.whatsapp-link{user-select:text;-webkit-user-select:text}
.header{padding:20px;text-align:center;background:linear-gradient(90deg,#4b0082,#1a1a2e);border-bottom:2px solid #d4af37}.header h1{color:#d4af37;margin:0;font-size:1.5rem}.header p{color:#ccc;margin:5px 0 0;font-size:.8rem}
.document-bar,.input-area{padding:12px 20px;background:#0d0d1a;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.upload-label,button{padding:10px 16px;border-radius:25px;border:1px solid #d4af37;background:#d4af37;color:#111;font-weight:bold;cursor:pointer}
.chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}.message{max-width:80%;padding:12px 15px;border-radius:15px;line-height:1.55}.user{align-self:flex-end;background:#d4af37;color:#111}.bot{align-self:flex-start;background:#1a1a2e;border:1px solid #444}.bot strong,.signature{color:#d4af37}
.input-area{border-top:1px solid #333;border-bottom:0}.input-area input[type=text]{flex:1;padding:12px;border-radius:25px;border:1px solid #d4af37;background:#111;color:#fff;outline:none;font-size:1rem}
.whatsapp-wrap{text-align:center;padding:10px 20px;background:#0d0d1a}.whatsapp-link{color:#d4af37;font-weight:700;text-decoration:none;text-shadow:0 0 6px rgba(212,175,55,.65);transition:all .2s ease}.whatsapp-link:hover,.whatsapp-link:focus{text-decoration:underline;text-shadow:0 0 12px rgba(212,175,55,1);transform:scale(1.03)}
</style>
</head>
<body>
<div class="header"><h1>👑 MercySoul Vision Brain</h1><p>Where Imagination Becomes Sacred Art</p></div>
<div class="document-bar"><label class="upload-label" for="pdfInput">Upload Document</label><input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden><span id="fileName">No PDF selected</span></div>
<div class="chat-container" id="chatBox"><div class="message bot">Welcome to the <strong>MercySoul Vision Brain</strong>.<br><span style="color:#ccc">Where Imagination Becomes Sacred Art.</span><span class="signature">Asẹ.</span></div></div>
<div class="input-area"><input type="text" id="userInput" placeholder="Describe what you need..."><button id="sendButton" type="button">Send</button></div>
<div class="whatsapp-wrap"><a id="whatsappLink" class="whatsapp-link" href="#">Chat with us on WhatsApp →</a></div>
<script>
(function(){
'use strict';
const WHATSAPP_LINK = window.WHATSAPP_LINK || '';
const DENIAL='The blessings of this Dominion flow only to those who are aligned. Your energy is no longer welcome here. Aṣẹ.';
let selectedPdf=null;
const pdfInput=document.getElementById('pdfInput'),fileName=document.getElementById('fileName'),chatBox=document.getElementById('chatBox'),input=document.getElementById('userInput'),sendButton=document.getElementById('sendButton'),whatsappLink=document.getElementById('whatsappLink');
whatsappLink.href=WHATSAPP_LINK||'#';
['contextmenu','copy','cut','dragstart','selectstart'].forEach(name=>document.addEventListener(name,e=>{if(e.target!==input)e.preventDefault();}));
pdfInput.addEventListener('change',()=>{selectedPdf=pdfInput.files&&pdfInput.files[0]||null;fileName.textContent=selectedPdf?selectedPdf.name:'No PDF selected';});
function append(type,text){const el=document.createElement('div');el.className='message '+type;el.textContent=text;chatBox.appendChild(el);chatBox.scrollTop=chatBox.scrollHeight;return el;}
async function sendMessage(){
  const message=input.value.trim();
  if(!message)return;
  append('user',message);
  input.value='';
  sendButton.disabled=true;
  const loading=append('bot','MercySoul is thinking...');
  try{
    // /api/chat uses bodyParser:false so send all chat requests as multipart.
    // Multer then populates req.body consistently, with or without a PDF.
    const form=new FormData();
    form.append('message',message);
    if(selectedPdf) form.append('file',selectedPdf,selectedPdf.name);
    const response=await fetch('/api/chat',{method:'POST',body:form});
    const data=await response.json().catch(()=>({}));
    loading.remove();
    if(!response.ok){
      append('bot',data.reply||data.error||`Chat request failed (${response.status}). Please try again. Asẹ.`);
      return;
    }
    append('bot',data.reply||data.error||'MercySoul did not return a response. Please try again. Asẹ.');
  }catch(error){
    loading.remove();
    append('bot','Unable to reach MercySoul chat right now. Please try again in a moment. Asẹ.');
    console.error('MercySoul chat error:',error);
  }finally{
    sendButton.disabled=false;
    input.focus();
  }
}
sendButton.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
})();
</script>
</body>
</html>
