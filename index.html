<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercySoul Vision Brain</title>
<style>
body{background:#050510;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;user-select:none;-webkit-user-select:none}.header{padding:20px;text-align:center;background:linear-gradient(90deg,#4b0082,#1a1a2e);border-bottom:2px solid #d4af37}.header h1{color:#d4af37;margin:0;font-size:1.5rem}.header p{color:#ccc;margin:5px 0 0;font-size:.8rem}.document-bar{padding:12px 20px;background:#0d0d1a;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.upload-label{padding:10px 16px;border-radius:25px;border:1px solid #d4af37;background:#d4af37;color:#111;font-weight:bold;cursor:pointer;user-select:text;-webkit-user-select:text}.chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}.message{max-width:80%;padding:12px 15px;border-radius:15px;line-height:1.55}.user{align-self:flex-end;background:#d4af37;color:#111}.bot{align-self:flex-start;background:#1a1a2e;border:1px solid #444}.bot strong,.signature{color:#d4af37}.whatsapp-area{padding:28px 20px;background:#0d0d1a;border-top:1px solid #333;text-align:center}.whatsapp-link{display:inline-block;color:#d4af37;font-size:1.15rem;font-weight:700;text-decoration:none;letter-spacing:.02em;text-shadow:0 0 6px rgba(212,175,55,.7),0 0 18px rgba(212,175,55,.35);transition:transform .2s ease,text-shadow .2s ease}.whatsapp-link:hover,.whatsapp-link:focus-visible{color:#f3d46b;text-decoration:underline;text-underline-offset:5px;transform:scale(1.03);text-shadow:0 0 8px rgba(212,175,55,.9),0 0 24px rgba(212,175,55,.55);outline:none}
</style>
</head>
<body>
<div class="header"><h1>👑 MercySoul Vision Brain</h1><p>Where Imagination Becomes Sacred Art</p></div>
<div class="document-bar"><label class="upload-label" for="pdfInput">Upload Document</label><input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden><span id="fileName">No PDF selected</span></div>
<div class="chat-container" id="chatBox"><div class="message bot">Welcome to the <strong>MercySoul Vision Brain</strong>.<br><span style="color:#ccc">Where Imagination Becomes Sacred Art.</span><span class="signature">Asẹ.</span></div></div>
<div class="whatsapp-area"><a id="whatsappLink" class="whatsapp-link" href="#">Chat with us on WhatsApp →</a></div>
<script>
(function(){
'use strict';
const WHATSAPP_LINK=window.WHATSAPP_LINK||'';
const pdfInput=document.getElementById('pdfInput'),fileName=document.getElementById('fileName'),whatsappLink=document.getElementById('whatsappLink');
['contextmenu','copy','cut','dragstart','selectstart'].forEach(name=>document.addEventListener(name,e=>{if(e.target!==pdfInput)e.preventDefault();}));
pdfInput.addEventListener('change',()=>{const selectedPdf=pdfInput.files&&pdfInput.files[0]||null;fileName.textContent=selectedPdf?selectedPdf.name:'No PDF selected';});
whatsappLink.href=WHATSAPP_LINK||'#';
})();
</script>
</body>
</html>
